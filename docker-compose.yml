services:
  flask-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flask_cicd_app
    ports:
      - "5000:5000"
    environment:
      - APP_ENV=development
      - APP_VERSION=1.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
